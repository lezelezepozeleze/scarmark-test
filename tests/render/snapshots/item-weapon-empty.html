<!-- part: header -->
<header class="sheet-header item-header">
<img class="portrait" src="icons/item.svg" data-action="editImage" alt="" />
<input class="name-input" type="text" name="name" value="" placeholder="{SCARMARK.NamePlaceholder}" />
</header>
<!-- part: details -->
<div class="tab details" data-group="primary" data-tab="details">
<div class="in-container-row">
<div class="field in-container">
<label class="plain-label">{SCARMARK.Container.inContainer}</label>
<select name="system.container">
<option value="" selected>{SCARMARK.Container.onPerson}</option>
</select>
</div>
<div class="checkbox-toggles">
<label class="checkbox-label">
<input type="checkbox" name="system.isShield" /> {SCARMARK.Weapon.isShield} </label>
<label class="checkbox-label">
<input type="checkbox" name="system.broken" /> {SCARMARK.Weapon.broken} </label>
</div>
</div>
<div class="gear-row">
<div class="field quantity">
<label>{SCARMARK.Quantity}</label>
<input type="number" step="1" name="system.quantity" value="1" />
</div>
<div class="field weight">
<label>{SCARMARK.WeightKg}</label>
<input type="number" step="0.1" name="system.weight" value="0" />
</div>
<div class="field value">
<label>{SCARMARK.Value}</label>
<input type="number" step="0.1" name="system.value" value="0" />
</div>
</div>
<div class="gear-row">
<div class="field weapon-quality">
<label>{SCARMARK.Weapon.quality}</label>
<input type="number" step="1" min="0" max="16" name="system.quality" value="10" />
</div>
<div class="field weapon-attack">
<label>{SCARMARK.Weapon.attack}</label>
<input type="number" step="1" name="system.attack" value="0" />
</div>
<div class="field weapon-defense">
<label>{SCARMARK.Weapon.defense}</label>
<input type="number" step="1" name="system.defense" value="0" />
</div>
</div>
<div class="gear-row">
<div class="field weapon-blunt">
<label>{SCARMARK.Aspect.blunt}</label>
<input type="number" step="1" min="-1" name="system.impact.blunt" value="0" />
</div>
<div class="field weapon-edged">
<label>{SCARMARK.Aspect.edged}</label>
<input type="number" step="1" min="-1" name="system.impact.edged" value="0" />
</div>
<div class="field weapon-piercing">
<label>{SCARMARK.Aspect.piercing}</label>
<input type="number" step="1" min="-1" name="system.impact.piercing" value="0" />
</div>
<div class="field weapon-fire">
<label>{SCARMARK.Aspect.fire}</label>
<input type="number" step="1" min="-1" name="system.impact.fire" value="0" />
</div>
</div>
<div class="gear-row">
<div class="field weapon-specialization">
<label>{SCARMARK.Weapon.specialization}</label>
<input type="number" step="1" name="system.specialization" value="0" />
</div>
<div class="field weapon-skill">
<label>{SCARMARK.Weapon.associatedSkill}</label>
<select name="system.associatedSkill">
<option value="close" selected>{SCARMARK.CombatSkill.close}</option>
<option value="ranged" >{SCARMARK.CombatSkill.ranged}</option>
<option value="unarmed" >{SCARMARK.CombatSkill.unarmed}</option>
<option value="arcane" >{SCARMARK.CombatSkill.arcane}</option>
</select>
</div>
</div>
<div class="field note">
<label class="plain-label">{SCARMARK.Trait.note}</label>
<input type="text" name="system.notes" value="" />
</div>
<div class="field artifact-toggle">
<label class="checkbox-label">
<input type="checkbox" name="system.artifact.active" /> {SCARMARK.Artifact.label} </label>
<label class="checkbox-label">
<input type="checkbox" name="system.rune" /> {SCARMARK.Gear.rune} </label>
<label class="checkbox-label">
<input type="checkbox" name="system.artifact.attuned" /> {SCARMARK.Artifact.attuned} </label>
<label class="artifact-class"> {SCARMARK.Artifact.class} <input type="number" name="system.artifact.class" value="1" step="1" min="1" max="5" />
</label>
</div>
</div>
<!-- part: effects -->
<div class="tab effects" data-group="primary" data-tab="effects">
<div class="effects-flat">
<div class="effects-header">
<span class="col-name">{SCARMARK.Effect.effect}</span>
<span class="col-duration">{SCARMARK.Effect.duration}</span>
<span class="col-changes">{SCARMARK.Effect.changes}</span>
<a class="add-effect" data-action="createEffect">
<i class="fa-solid fa-plus">
</i> {SCARMARK.Add} </a>
</div>
<ol class="effects-list flat">
<li class="effect-empty">{SCARMARK.Effect.none}</li>
</ol>
</div>
</div>
<!-- part: actions -->
<div class="tab actions" data-group="primary" data-tab="actions">
<div class="actions-panel" data-actions-path="system.actions">
<div class="actions-header">
<a class="add-action" data-action="createAction">
<i class="fa-solid fa-plus">
</i> {SCARMARK.Add} </a>
</div>
<ol class="actions-list">
<li class="action-empty">{SCARMARK.Action.none}</li>
</ol>
</div>
</div>
