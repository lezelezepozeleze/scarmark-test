<!-- part: header -->
<header class="sheet-header item-header">
<img class="portrait" src="icons/item.svg" data-action="editImage" alt="" />
<input class="name-input" type="text" name="name" value="" placeholder="{SCARMARK.NamePlaceholder}" />
</header>
<!-- part: details -->
<div class="tab details" data-group="primary" data-tab="details">
<div class="gear-row">
<div class="field quantity">
<label>{SCARMARK.Quantity}</label>
<input type="number" step="1" name="system.quantity" value="1" />
</div>
<div class="field weight">
<label>{SCARMARK.WeightKg}</label>
<input type="number" step="0.1" name="system.weight" value="0" />
</div>
<div class="field value">
<label>{SCARMARK.Value}</label>
<input type="number" step="0.1" name="system.value" value="0" />
</div>
<div class="field max-capacity">
<label>{SCARMARK.Container.maxCapacity}</label>
<input type="number" step="0.1" min="0" name="system.maxCapacity" value="1" />
</div>
</div>
<div class="field note">
<label class="plain-label">{SCARMARK.Trait.note}</label>
<input type="text" name="system.notes" value="" />
</div>
</div>
<!-- part: stored -->
<div class="tab stored" data-group="primary" data-tab="stored">
<div class="stored-capacity"> {SCARMARK.Container.loadedLine} </div>
<ol class="gear-list stored-list">
<li class="gear-empty">{SCARMARK.Container.noStored}</li>
</ol>
</div>
<!-- part: actions -->
<div class="tab actions" data-group="primary" data-tab="actions">
<div class="actions-panel" data-actions-path="system.actions">
<div class="actions-header">
<a class="add-action" data-action="createAction">
<i class="fa-solid fa-plus">
</i> {SCARMARK.Add} </a>
</div>
<ol class="actions-list">
<li class="action-empty">{SCARMARK.Action.none}</li>
</ol>
</div>
</div>
